plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juli22292.vencordandroidapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.juli22292.vencordandroidapp"
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName "0.0.4"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
