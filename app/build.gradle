plugins {
    id 'com.android.application'
}

def coreVersion = providers.gradleProperty('vencordCoreVersion').get()
def lspatchLibrary = file('libs/lspatch-v1.2-487-release.jar')
def lspatchAssets = layout.buildDirectory.dir('generated/assets/lspatch')
def prepareLspatchAssets = tasks.register('prepareLspatchAssets', Sync) {
    from(zipTree(lspatchLibrary)) {
        include 'assets/lspatch/so/**/*.so'
        eachFile { path = path.substring('assets/'.length()) }
        includeEmptyDirs = false
    }
    into(lspatchAssets)
}
def moduleApk = project(':xposed-module').layout.buildDirectory.file('outputs/apk/release/xposed-module-release.apk')
def embeddedAssets = layout.buildDirectory.dir('generated/assets/embedded-module')
def embedXposedModule = tasks.register('embedXposedModule', Sync) {
    dependsOn ':xposed-module:assembleRelease'
    from(moduleApk)
    rename { 'vencord_xposed_module.apk' }
    into(embeddedAssets)
    doLast {
        if (!moduleApk.get().asFile.isFile()) {
            throw new GradleException('The Xposed module APK is missing.')
        }
    }
}

android {
    namespace 'com.juli22292.vencordandroidapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.juli22292.vencordandroidapp"
        minSdk 28
        targetSdk 34
        versionCode 11
        versionName "0.1.1"
        buildConfigField 'String', 'CORE_VERSION', "\"$coreVersion\""
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets.main.assets.srcDir(embeddedAssets)
    sourceSets.main.assets.srcDir(lspatchAssets)

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA'
            ]
        }
    }
}

tasks.named('preBuild') {
    dependsOn embedXposedModule, prepareLspatchAssets
}

dependencies {
    implementation files(lspatchLibrary)
}
