plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juli22292.vencordandroidapp'
    compileSdk 34

    defaultConfig {
        applicationId "com.juli22292.vencordandroidapp"
        minSdk 28
        targetSdk 34
        versionCode 7
        versionName "0.0.7"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            applicationIdSuffix ""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE',
                'META-INF/LICENSE.txt',
                'META-INF/NOTICE',
                'META-INF/NOTICE.txt',
                'META-INF/INDEX.LIST',
                'META-INF/DEPENDENCIES',
                'META-INF/*.SF',
                'META-INF/*.DSA',
                'META-INF/*.RSA'
            ]
        }
    }
}

dependencies {
    implementation files('libs/lspatch.aar')
}
