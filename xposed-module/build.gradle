plugins {
    id 'com.android.application'
}

android {
    namespace 'com.juli22292.vencordforandroid.xposed'
    compileSdk 34

    defaultConfig {
        applicationId "com.juli22292.vencordforandroid.xposed"
        minSdk 24
        targetSdk 34
        versionCode 12
        versionName providers.gradleProperty('vencordCoreVersion').get()
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
