name: Build VencordAndroidApp APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build Embedded Xposed Module APK
        run: |
          gradle :xposed-module:assembleRelease --no-daemon
          cp xposed-module/build/outputs/apk/release/xposed-module-release.apk app/src/main/assets/vencord_xposed_module.apk

      - name: Build VencordAndroidApp Release APK
        run: |
          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk vencordandroidapp.apk

      - name: Upload vencordandroidapp.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vencordandroidapp-apk
          path: vencordandroidapp.apk
